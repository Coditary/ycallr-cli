[package]
name = "ycallr"
version = "0.1.3"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["Leodoras"]
description = "YAML-based API caller CLI"

[lib]
name = "ycallr"
path = "src/lib.rs"

[[bin]]
name = "ycallr"
path = "src/main.rs"

[dependencies]
ycallr-core = { path = "../ycallr-core", features = ["ffi"], default-features = false }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "5"
keyring = "3"
rpassword = "7"

[dev-dependencies]
assert_cmd = "2"
mockito = "1.6"
predicates = "3"
tempfile = "3"
